name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build terminal-games
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' \
            -o dist/terminal-games-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/terminal-games

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/terminal-games-${{ matrix.goos }}-${{ matrix.goarch }}
          fail_on_unmatched_files: true
